<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的植物紀錄</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: #f4f7f4; color: #26352a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif; }

/* Header & 導航列 */
header { background: #2d5a37; color: white; padding: 14px 12px; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
header h1 { margin: 0 0 10px; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.bar { display: flex; gap: 6px; }
.bar input { flex: 1; padding: 10px 12px; border-radius: 10px; border: none; font-size: 14px; outline: none; }
.bar button { background: #468252; color: white; border: none; padding: 0 14px; border-radius: 10px; font-weight: bold; font-size: 14px; white-space: nowrap; }

/* 工具列與檢視切換 */
main { max-width: 900px; margin: auto; padding: 12px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; justify-content: space-between; }
.tool-group { display: flex; gap: 6px; flex-wrap: wrap; }
button { cursor: pointer; font: inherit; border: 1px solid #c2d1c5; border-radius: 8px; padding: 7px 12px; background: white; color: #2d5a37; font-size: 13px; transition: all 0.15s ease; }
button:active { transform: scale(0.97); }
button.active { background: #2d5a37; color: white; border-color: #2d5a37; }
.primary { background: #2d5a37; color: #fff; border: 0; font-weight: bold; }
.danger { color: #a52e2e; border-color: #f0c2c2; background: #fff5f5; }

/* 🎴 圖卡模式 (Card View) */
.grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 10px; align-items: start; }
.card-item { width: 105px; min-height: 143px; background: #fff; border-radius: 10px; padding: 7px; box-shadow: 0 2px 6px rgba(0,0,0,0.07); border: 1px solid #e1ebe2; display: flex; flex-direction: column; align-items: center; text-align: center; user-select: none; cursor: pointer; touch-action: pan-y; transition: transform .12s, opacity .12s, box-shadow .12s; }
.card-item.dragging { opacity: .72; transform: scale(1.04); box-shadow: 0 8px 22px rgba(0,0,0,.18); z-index: 20; }
.card-item.drag-over { outline: 2px dashed #5c8b67; outline-offset: 2px; }
.card-thumb { width: 50px; height: 50px; min-width: 50px; border-radius: 7px; object-fit: cover; background: #e8eee8; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 5px; }
.card-info { width: 100%; overflow: hidden; }
.card-title { font-size: 13px; font-weight: bold; line-height: 1.25; color: #1e3323; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-line { font-size: 11px; color: #57705c; line-height: 1.45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-hint { font-size: 9px; color: #9aa69c; margin-top: 2px; }
.sort-btns { display: none; }
.sort-btn { display: none; }

/* 📋 清單模式 (List View) */
.list-view { display: flex; flex-direction: column; gap: 8px; }
.list-header { display: grid; grid-template-columns: 32px 30px 1.2fr 1fr 1fr 1fr 50px; gap: 6px; padding: 8px 10px; background: #e2ebe3; font-size: 12px; font-weight: bold; color: #3a543f; border-radius: 8px; text-align: center; align-items: center; }
.list-item { display: grid; grid-template-columns: 32px 30px 1.2fr 1fr 1fr 1fr 50px; gap: 6px; padding: 8px 10px; background: #fff; border-radius: 8px; border: 1px solid #e1ebe2; font-size: 13px; align-items: center; text-align: center; }
.list-thumb { width: 20px; height: 20px; border-radius: 4px; object-fit: cover; margin: auto; background: #eee; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.list-name { font-weight: bold; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #555; font-size: 12px; }

/* Modal 彈窗與表單 */
.empty { text-align: center; padding: 50px 10px; color: #718075; font-size: 14px; }
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; overflow: auto; padding: 10px; }
.box { background: #f8faf8; max-width: 750px; margin: 10px auto; border-radius: 16px; padding: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
.modalhead { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid #e0e8e1; }
.modalhead h2 { margin: 0; font-size: 18px; color: #2d5a37; }
.section { background: white; border-radius: 10px; padding: 12px; margin-top: 10px; border: 1px solid #e5ebe5; }
.section h3 { margin: 0 0 10px; font-size: 15px; color: #2d5a37; display: flex; align-items: center; gap: 4px; }
.formgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.field { display: flex; flex-direction: column; }
.field label { font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #445c48; }
.field input, .field textarea, .field select { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid #ccd6cc; border-radius: 8px; background: #fff; font-size: 14px; }
.full { grid-column: 1 / -1; }
.photo-grid { display: flex; flex-wrap: wrap; gap: 14px 12px; padding-top: 6px; }
.photo-slot { position: relative; width: 50px; height: 50px; }
.photo-slot.cover .photo-preview { outline: 2px solid #e0a800; outline-offset: 1px; }
.photo-star { position: absolute; left: -5px; bottom: -7px; width: 20px; height: 20px; padding: 0; border: 0; background: transparent; font-size: 15px; line-height: 20px; }
.photo-tip { font-size: 11px; color: #78877b; margin-top: 8px; }
.fert-red { color: #d11 !important; font-weight: bold; }
.fert-blue { color: #1a5fd0 !important; font-weight: bold; }
.card-date { width: 100%; max-width: 100%; font: inherit; font-size: 10px; padding: 1px 0; border: 1px solid #d5e0d6; border-radius: 5px; background: #f7faf7; color: #57705c; text-align: center; min-height: 18px; }
.photo-preview { width: 50px; height: 50px; object-fit: cover; border-radius: 7px; background: #e5ebe5; display: block; }
.photo-cloud { width: 50px; height: 50px; padding: 0; font-size: 28px; line-height: 50px; border: 1.5px dashed #9bb5a0; border-radius: 7px; background: #f1f6f2; cursor: pointer; }
.photo-del { position: absolute; top: -7px; right: -7px; width: 20px; height: 20px; padding: 0; border-radius: 50%; border: 1px solid #e4bcbc; background: #fff; color: #a52e2e; font-weight: bold; font-size: 14px; line-height: 18px; }
.photo-status { font-size: 11px; color: #78877b; margin-top: 4px; }
.field textarea { overflow: hidden; resize: none; }
.sun-desc { background: #f1f6f2; color: #3a543f; font-size: 13px; resize: none; }
.auto-btn { background: #2d5a37; color: white; font-weight: bold; border: none; white-space: nowrap; padding: 0 12px; border-radius: 8px; }
.small-record-btn{width:25px;height:25px;padding:0;border-radius:50%;background:#2d5a37;color:#fff;border:0;font-size:18px;line-height:25px}.record-row{display:grid;grid-template-columns:32px 120px 1fr 28px;gap:7px;align-items:center;margin-top:8px;padding:7px;background:#f4f7f4;border:1px solid #dce6dd;border-radius:8px}.record-row input{width:100%;font:inherit;padding:7px;border:1px solid #ccd6cc;border-radius:7px}.record-cloud{width:28px;height:28px;padding:0;border:0;background:transparent;font-size:19px;cursor:pointer}.record-thumb{width:10px;height:10px;object-fit:cover;border-radius:2px;display:block}.record-remove{width:26px;height:26px;padding:0;border-radius:50%;color:#a52e2e;border:1px solid #e4bcbc;background:#fff;font-weight:bold}.record-hint{font-size:11px;color:#78877b}
.input-group { display: flex; gap: 6px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; position: sticky; bottom: 0; background: #f8faf8; padding: 10px 0; border-top: 1px solid #e0e8e1; }

@media(max-width: 650px) {
  .formgrid { grid-template-columns: 1fr; }
  .full { grid-column: auto; }
  .list-header, .list-item { grid-template-columns: 24px 24px 1.2fr 1fr 1fr 50px; font-size: 11px; padding: 6px 4px; }
  .hide-mobile { display: none; } /* 手機下隱藏購買日期以防擠壓 */
}
</style>
</head>
<body>

<header>
  <h1>🌿 我的植物紀錄 <span id="syncStatus" style="font-size:11px;font-weight:normal;opacity:.85"></span></h1>
  <div class="bar">
    <input id="search" placeholder="搜尋植物、日照、位置…">
    <button onclick="openPlant()">＋新增</button>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="tool-group">
      <button id="btnGrid" class="active" onclick="setViewMode('grid')">🎴 圖卡</button>
      <button id="btnList" onclick="setViewMode('list')">📋 清單</button>
    </div>
    <div class="tool-group">
      <button onclick="exportData()">⬇ 備份</button>
      <button onclick="document.getElementById('importFile').click()">⬆ 匯入</button>
      <input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </div>

  <div id="container"></div>
</main>

<!-- 編輯/新增Modal -->
<div id="modal" class="modal"><div class="box">
  <div class="modalhead">
    <h2 id="modalTitle">新增植物</h2>
    <button onclick="closeModal()">✕</button>
  </div>
  <form id="plantForm">
    <input type="hidden" id="pid">

    <div class="section">
      <h3>🌱 植物資料</h3>
      <div class="formgrid">
        <div class="field full">
          <label>植物照片</label>
          <div class="photo-grid" id="photoGrid"></div>
          <div id="photoStatus" class="photo-status"></div>
          <input id="photo" type="file" accept="image/*" multiple style="display:none">
        </div>
        <div class="field full"><label>植物名稱 *</label><input id="name" required></div>
        <div class="field"><label>別名</label><input id="alias"></div>
        <div class="field"><label>學名</label><input id="scientific"></div>
        <div class="field"><label>科別</label><input id="family"></div>
        <div class="field"><label>植物類型</label><input id="type"></div>
      </div>
    </div>

    <div class="section"><h3>☀️ 生長環境</h3><div class="formgrid">
      <div class="field"><label>日照方式</label>
        <select id="sun" onchange="updateSunDesc()">
          <option value="">請選擇</option>
          <option value="全日照">全日照</option>
          <option value="半日照">半日照</option>
          <option value="明亮散射光">明亮散射光</option>
          <option value="半陰/陰蔽光">半陰/陰蔽光</option>
          <option value="耐陰/弱光">耐陰/弱光</option>
        </select></div>
      <div class="field"><label>日照方式說明</label><textarea id="sunHours" class="sun-desc" rows="4" readonly placeholder="選擇日照方式後自動顯示說明"></textarea></div>
      <div class="field"><label>適合溫度</label><input id="temperature"></div>
      <div class="field"><label>濕度需求</label><input id="humidity"></div>
      <div class="field"><label>耐寒程度</label><input id="cold"></div>
      <div class="field"><label>土壤要求</label><input id="soilRequirement"></div>
      <div class="field full"><label>其他環境注意事項</label><textarea id="envNote" rows="2"></textarea></div>
    </div></div>

    <div class="section"><h3>💧 澆水</h3><div class="formgrid">
      <div class="field full"><label>澆水方式</label><textarea id="waterMethod" rows="2"></textarea></div>
    </div></div>

    <div class="section"><h3>🪴 土壤／盆器</h3><div class="formgrid">
      <div class="field"><label>花盆尺寸</label><input id="potSize"></div>
      <div class="field"><label>上次換盆日期</label><input id="repot" type="date"></div>
    </div></div>

    <div class="section"><h3>🧪 施肥</h3><div class="formgrid">
      <div class="field"><label>肥料名稱</label><input id="fertilizer"></div>
      <div class="field"><label>施肥頻率</label><input id="fertFreq"></div>
      <div class="field"><label>使用濃度／倍數</label><input id="fertRatio"></div>
      <div class="field"><label>最後施肥日期</label><input id="lastFert" type="date"></div>
      <div class="field"><label>提醒施肥天數</label><input id="fertRemind" type="number" min="1" inputmode="numeric" placeholder="例如：10"></div>
      <div class="field full"><label>施肥注意事項</label><textarea id="fertNote" rows="2"></textarea></div>
    </div></div>

    <div class="section"><h3>🌸 開花</h3><div class="formgrid">
      <div class="field"><label>花期</label><input id="flowerSeason" placeholder="例如：3月～6月"></div>
    </div></div>

    <div class="section"><h3>✂️ 修剪／繁殖</h3><div class="formgrid">
      <div class="field"><label>修剪方式</label><textarea id="prune" rows="2"></textarea></div>
      <div class="field"><label>繁殖方式</label><input id="propagate"></div>
    </div></div>

    <div class="section">
      <h3>📝 種植記錄 <button type="button" class="small-record-btn" onclick="addPlantRecord()">＋</button></h3>
      <div class="formgrid">
        <div class="field"><label>購買日期</label><input id="buyDate" type="date"></div>
        <div class="field"><label>購買地點</label><input id="buyPlace"></div>
        <div class="field"><label>價格</label><input id="price" type="number"></div>
        <div class="field"><label>種植位置</label><input id="location"></div>
      </div>
      <div id="plantRecords"></div>
    </div>

    <div class="actions">
      <button type="button" class="danger" onclick="deletePlant()">刪除</button>
      <button type="button" onclick="closeModal()">取消</button>
      <button class="primary" type="submit">💾 儲存</button>
    </div>
  </form>
</div></div>

<script>
const KEY = 'myPlantRecords_v2';
let plants = JSON.parse(localStorage.getItem(KEY) || '[]');
let viewMode = localStorage.getItem('plant_view_mode') || 'grid';
let currentPhotos = [];
let currentCover = 0;
let currentRecords = [];

const ids = ['name','alias','scientific','family','type','sun','sunHours','temperature','humidity','cold','soilRequirement','envNote','waterMethod','potSize','repot','fertilizer','fertFreq','fertRatio','lastFert','fertRemind','fertNote','flowerSeason','prune','propagate','buyDate','buyPlace','price','location'];
const $ = id => document.getElementById(id);

const IMGBB_API_KEY = '3e63e52100d718b4fe1b7f8be452fd15'; // ← 把你的 imgbb API key 貼在這對引號中間，☁️ 就會上傳到 imgbb

const SUN_DESC = {
  '全日照': '直射光≧6小時',
  '半日照': '直射光 3～5 小時',
  '明亮散射光': '環境非常明亮、光線充足，但陽光不會直接曬到植物',
  '半陰/陰蔽光': '光照強度較低，多為透過大樹樹冠層篩落下來的點點光影，或是靠近室內窗邊但光線略暗的地方',
  '耐陰/弱光': '幾乎沒有直接日光，僅靠室內普通燈光或遠離窗戶的角落。這類環境雖然植物能存活，但生長速度會變慢。'
};

function normalizeSun(v) {
  v = String(v || '').trim();
  if (!v || SUN_DESC[v]) return v;
  if (v.includes('全日')) return '全日照';
  if (v.includes('半日')) return '半日照';
  if (v.includes('散射')) return '明亮散射光';
  if (v.includes('半陰') || v.includes('陰蔽')) return '半陰/陰蔽光';
  if (v.includes('耐陰') || v.includes('弱光')) return '耐陰/弱光';
  return v;
}
function setSunValue(v) {
  v = normalizeSun(v);
  const sel = $('sun');
  sel.querySelectorAll('option[data-extra]').forEach(o => o.remove());
  if (v && !SUN_DESC[v]) { // 舊資料的自訂文字，保留不遺失
    const o = document.createElement('option');
    o.value = v; o.textContent = v; o.dataset.extra = '1';
    sel.appendChild(o);
  }
  sel.value = v;
  updateSunDesc();
}
function updateSunDesc() { $('sunHours').value = SUN_DESC[$('sun').value] || ''; autoGrow($('sunHours')); }

// 多行欄位依內容自動長高，內容不會被隱藏
function autoGrow(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
function autoGrowAll() { document.querySelectorAll('#plantForm textarea').forEach(autoGrow); }
document.addEventListener('input', e => { if (e.target.matches && e.target.matches('#plantForm textarea')) autoGrow(e.target); });

// ☁️ 植物照片（可多張，並可選封面）
function renderPhoto() {
  if (currentCover >= currentPhotos.length) currentCover = 0;
  let html = currentPhotos.map((src, i) => `
    <div class="photo-slot ${i === currentCover ? 'cover' : ''}">
      <img class="photo-preview" src="${esc(src)}" alt="">
      <button type="button" class="photo-del" title="刪除照片" onclick="removePhoto(${i})">−</button>
      <button type="button" class="photo-star" title="設為封面" onclick="setCover(${i})">${i === currentCover ? '⭐' : '☆'}</button>
    </div>`).join('');
  html += `<div class="photo-slot"><button type="button" class="photo-cloud" title="上傳照片" onclick="$('photo').click()">☁️</button></div>`;
  $('photoGrid').innerHTML = html;
}
function removePhoto(i) {
  currentPhotos.splice(i, 1);
  if (i < currentCover) currentCover--;
  else if (i === currentCover) currentCover = 0;
  renderPhoto();
}
function setCover(i) { currentCover = i; renderPhoto(); }

// 縮成 200×200（顯示為 50×50，保持清晰）
function resizeImage(file, size = 200) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const side = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('圖片讀取失敗')); };
    img.src = url;
  });
}
async function uploadToImgbb(dataUrl) {
  const fd = new FormData();
  fd.append('image', dataUrl.split(',')[1]);
  const res = await fetch('https://api.imgbb.com/1/upload?key=' + encodeURIComponent(IMGBB_API_KEY), { method: 'POST', body: fd });
  const j = await res.json();
  if (!j.success) throw new Error('imgbb 上傳失敗');
  return j.data.display_url || j.data.url;
}

function save() {
  localStorage.setItem(KEY, JSON.stringify(plants));
  render();
  if (window.cloudSync) window.cloudSync();
}

// ☁️ 供 Firebase 同步模組使用
window.getPlants = () => plants;
window.applyCloudPlants = arr => {
  plants = arr;
  localStorage.setItem(KEY, JSON.stringify(plants));
  render();
};

function setViewMode(mode) {
  viewMode = mode;
  localStorage.setItem('plant_view_mode', mode);
  $('btnGrid').className = mode === 'grid' ? 'active' : '';$('btnList').className = mode === 'list' ? 'active' : '';
  render();
}

function esc(s = '') { return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }

function moveSort(index, direction, e) {
  e.stopPropagation();
  let targetIndex = index + direction;
  if (targetIndex < 0 || targetIndex >= plants.length) return;
  let temp = plants[index];
  plants[index] = plants[targetIndex];
  plants[targetIndex] = temp;
  save();
}

function render() {
  let q = $('search').value.trim().toLowerCase();
  let filtered = plants.filter(p => JSON.stringify(p).toLowerCase().includes(q));
  let container = $('container');

  if (!filtered.length) {
    container.className = '';
    container.innerHTML = `<div class="empty">尚無植物紀錄<br><br>按上方「＋新增」建立植物圖鑑 🌱</div>`;
    return;
  }

  if (viewMode === 'grid') {
    // 🎴 圖卡模式：不顯示排序按鈕，改用滑鼠／手指長按後拖曳排序
    container.className = 'grid-view';
    container.innerHTML = filtered.map(p => `
      <div class="card-item" data-id="${esc(p.id)}" onclick="openPlant('${esc(p.id)}')">
        ${p.photo ? `<img class="card-thumb" src="${p.photo}">` : `<div class="card-thumb">🌿</div>`}
        <div class="card-info">
          <div class="card-title">${esc(p.name || '未命名植物')}</div>
          <div class="card-line">☀️ ${esc(p.sun || '未設定')}</div>
          <div class="card-line">購買日期<br>${esc(formatDate(p.buyDate))}</div>
          <div class="card-line">施肥日期<br><input type="date" class="card-date ${fertStatus(p)}" value="${esc(p.lastFert || '')}" onclick="event.stopPropagation()" onchange="updateLastFert('${esc(p.id)}', this.value)"></div>
        </div>
      </div>
    `).join('');
    bindCardDrag();
  } else {
    // 📋 清單模式：保留原本的排序按鈕
    container.className = 'list-view';
    let html = `
      <div class="list-header">
        <div>#</div>
        <div>圖</div>
        <div style="text-align:left">名稱</div>
        <div>日照</div>
        <div class="hide-mobile">購買日期</div>
        <div>最後施肥</div>
        <div>排序</div>
      </div>
    `;
    html += filtered.map((p, i) => `
      <div class="list-item" onclick="openPlant('${esc(p.id)}')">
        <div style="color:#888;font-size:11px">${i + 1}</div>
        ${p.photo ? `<img class="list-thumb" src="${p.photo}">` : `<div class="list-thumb">🌿</div>`}
        <div class="list-name">${esc(p.name)}</div>
        <div class="list-text">${esc(p.sun || '-')}</div>
        <div class="list-text hide-mobile">${esc(p.buyDate || '-')}</div>
        <div class="list-text ${fertStatus(p)}">${esc(p.lastFert || '-')}</div>
        <div class="sort-btns" style="display:flex;flex-direction:row">
          <button class="sort-btn" style="display:block" onclick="moveSortById('${esc(p.id)}', -1, event)">▲</button>
          <button class="sort-btn" style="display:block" onclick="moveSortById('${esc(p.id)}', 1, event)">▼</button>
        </div>
      </div>
    `).join('');
    container.innerHTML = html;
  }
}

// 施肥提醒：到期日前 2 天（含）藍字，到期日當天及之後紅字
function fertStatus(p) {
  const n = parseInt(p.fertRemind, 10);
  const m = String(p.lastFert || '').match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (!m || !(n > 0)) return '';
  const due = new Date(+m[1], +m[2] - 1, +m[3] + n);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((due - today) / 86400000);
  if (diff <= 0) return 'fert-red';
  if (diff <= 2) return 'fert-blue';
  return '';
}

function updateLastFert(id, v) {
  let p = plants.find(x => String(x.id) === String(id));
  if (!p) return;
  p.lastFert = v;
  save();
}

function formatDate(v) {
  if (!v) return '未設定';
  let m = String(v).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  return m ? `${m[1]}/${String(m[2]).padStart(2,'0')}/${String(m[3]).padStart(2,'0')}` : v;
}

function moveSortById(id, direction, e) {
  e.stopPropagation();
  let index = plants.findIndex(p => String(p.id) === String(id));
  let target = index + direction;
  if (index < 0 || target < 0 || target >= plants.length) return;
  [plants[index], plants[target]] = [plants[target], plants[index]];
  save();
}

function bindCardDrag() {
  const cards = [...document.querySelectorAll('.card-item')];
  let pressTimer = null, dragging = null, moved = false, suppressClick = false;

  const clearTimer = () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } };

  cards.forEach(card => {
    card.addEventListener('pointerdown', e => {
      if (e.target.closest('.card-date')) return; // 點日期欄位不觸發長按拖曳
      if (e.button !== undefined && e.button !== 0) return;
      moved = false;
      suppressClick = false;
      clearTimer();
      const startX = e.clientX, startY = e.clientY;
      pressTimer = setTimeout(() => {
        dragging = card;
        suppressClick = true;
        card.classList.add('dragging');
        if (navigator.vibrate) navigator.vibrate(35);
      }, 350);

      const move = ev => {
        const dx = ev.clientX - startX, dy = ev.clientY - startY;
        if (Math.hypot(dx, dy) > 8) moved = true;
        if (!dragging) {
          if (moved && Math.hypot(dx,dy) > 12) clearTimer();
          return;
        }
        ev.preventDefault();
        const under = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.card-item');
        if (!under || under === dragging) return;
        const rect = under.getBoundingClientRect();
        const after = ev.clientX > rect.left + rect.width / 2;
        const parent = under.parentNode;
        if (after) parent.insertBefore(dragging, under.nextSibling);
        else parent.insertBefore(dragging, under);
      };

      const up = () => {
        clearTimer();
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        document.removeEventListener('pointercancel', up);
        if (dragging) {
          dragging.classList.remove('dragging');
          const order = [...document.querySelectorAll('.card-item')].map(x => x.dataset.id);
          const q = $('search').value.trim().toLowerCase();
          if (!q) {
            const map = new Map(plants.map(p => [String(p.id), p]));
            plants = order.map(id => map.get(String(id))).filter(Boolean);
            save();
          } else {
            // 搜尋狀態下只重新排列搜尋結果，其餘植物維持原本相對順序
            const visible = new Set(order);
            const sortedVisible = order.map(id => plants.find(p => String(p.id) === String(id))).filter(Boolean);
            let n = 0;
            plants = plants.map(p => visible.has(String(p.id)) ? sortedVisible[n++] : p);
            save();
          }
          dragging = null;
        }
      };
      document.addEventListener('pointermove', move, {passive:false});
      document.addEventListener('pointerup', up);
      document.addEventListener('pointercancel', up);
    });

    card.addEventListener('click', e => {
      if (suppressClick) { e.preventDefault(); e.stopPropagation(); suppressClick = false; }
    }, true);
  });
}

$('search').oninput = render;

function openPlant(id) {
  $('modal').style.display = 'block';$('modalTitle').textContent = id ? '編輯植物' : '新增植物';
  $('plantForm').reset();
  currentPhotos = [];
  currentCover = 0;
  currentRecords = [];
  $('pid').value = id || '';
  setSunValue('');

  if (id) {
    let p = plants.find(x => x.id === id);
    if (p) {
      ids.forEach(k => $(k).value = p[k] ?? '');
      setSunValue(p.sun);
      currentPhotos = Array.isArray(p.photos) ? p.photos.slice() : (p.photo ? [p.photo] : []);
      currentCover = Number.isInteger(p.cover) ? p.cover : 0;
      currentRecords = Array.isArray(p.records) ? p.records : [];
    }
  }
  $('photoStatus').textContent = '';
  renderPhoto();
  renderPlantRecords();
  autoGrowAll();
}

function addPlantRecord(){
  currentRecords.unshift({date:new Date().toISOString().slice(0,10),text:'',photo:''});
  renderPlantRecords();
}
function renderPlantRecords(){
  const box=$('plantRecords');
  if(!currentRecords.length){box.innerHTML='';return;}
  box.innerHTML=currentRecords.map((r,i)=>`<div class="record-row">
    <button type="button" class="record-cloud" title="上傳圖片" onclick="chooseRecordImage(${i})">${r.photo?`<img class="record-thumb" src="${r.photo}">`:'☁️'}</button>
    <input type="date" value="${esc(r.date||'')}" onchange="currentRecords[${i}].date=this.value">
    <input placeholder="輸入你的種植經驗…" value="${esc(r.text||'')}" oninput="currentRecords[${i}].text=this.value">
    <button type="button" class="record-remove" onclick="removePlantRecord(${i})">−</button>
  </div><input id="recordFile${i}" type="file" accept="image/*" style="display:none" onchange="loadRecordImage(event,${i})">`).join('');
}
function chooseRecordImage(i){$('recordFile'+i).click()}
async function loadRecordImage(e,i){let f=e.target.files[0];if(!f)return;try{let d=await resizeImage(f,200);currentRecords[i].photo=IMGBB_API_KEY?await uploadToImgbb(d):d;renderPlantRecords()}catch(err){alert('照片處理失敗：'+err.message)}}
function removePlantRecord(i){currentRecords.splice(i,1);renderPlantRecords()}

function closeModal() { $('modal').style.display = 'none'; }

$('photo').onchange = async e => {
  const files = [...e.target.files];
  if (!files.length) return;
  const st = $('photoStatus');
  for (let n = 0; n < files.length; n++) {
    try {
      st.textContent = (IMGBB_API_KEY ? '上傳中…' : '處理中…') + ` (${n + 1}/${files.length})`;
      let data = await resizeImage(files[n]);
      currentPhotos.push(IMGBB_API_KEY ? await uploadToImgbb(data) : data);
      renderPhoto();
    } catch (err) {
      st.textContent = '⚠️ ' + err.message;
      e.target.value = '';
      return;
    }
  }
  st.textContent = '';
  e.target.value = '';
};

$('plantForm').onsubmit = e => {
  e.preventDefault();
  let id = $('pid').value || Date.now().toString();
  if (currentCover >= currentPhotos.length) currentCover = 0;
  let p = { id, photos: currentPhotos, cover: currentCover, photo: currentPhotos[currentCover] || '', records: currentRecords };
  ids.forEach(k => p[k] = $(k).value);

  let idx = plants.findIndex(x => x.id === id);
  if (idx >= 0) plants[idx] = p; else plants.unshift(p);

  save();
  closeModal();
};

function deletePlant() {
  let id = $('pid').value;
  if (!id) return closeModal();
  if (confirm('確定要刪除這株植物？')) {
    plants = plants.filter(p => p.id !== id);
    save();
    closeModal();
  }
}

function exportData() {
  let blob = new Blob([JSON.stringify(plants, null, 2)], { type: 'application/json' });
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '我的植物紀錄.json';
  a.click();
}

function importData(e) {
  let file = e.target.files[0];
  if (!file) return;
  let r = new FileReader();
  r.onload = () => {
    try {
      let data = JSON.parse(r.result);
      if (Array.isArray(data) && confirm('匯入將覆蓋現有資料，確定？')) {
        plants = data;
        save();
      }
    } catch { alert('檔案格式不正確！'); }
  };
  r.readAsText(file);
}

setViewMode(viewMode);
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCSbGBliR-ErS04_VPLErQmBcFaySorkIc",
  authDomain: "plants-b1c17.firebaseapp.com",
  projectId: "plants-b1c17",
  storageBucket: "plants-b1c17.firebasestorage.app",
  messagingSenderId: "983708051937",
  appId: "1:983708051937:web:1d7efbae162222a22e0aa0"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
const col = collection(db, 'plants');
const FLAG = 'plants_cloud_inited';

let ready = false, started = false, syncing = false, again = false;
let cloudMap = new Map(); // id -> 雲端目前內容（用來比對哪些資料有變動）

const setStatus = t => { const el = document.getElementById('syncStatus'); if (el) el.textContent = t; };
const stable = o => JSON.stringify(o, (k, v) =>
  v && typeof v === 'object' && !Array.isArray(v) ? Object.keys(v).sort().reduce((a, x) => (a[x] = v[x], a), {}) : v);

// 把本機與雲端比對，只寫入有變動的植物、刪除已不存在的植物
window.cloudSync = async function () {
  if (!ready) return;
  if (syncing) { again = true; return; }
  syncing = true;
  try {
    do {
      again = false;
      const ops = [], keep = new Set(), tooBig = [];
      window.getPlants().forEach((p, i) => {
        const data = JSON.parse(JSON.stringify(p));
        data.order = i;
        const id = String(p.id);
        keep.add(id);
        const s = stable(data);
        if (cloudMap.get(id) === s) return;
        if (s.length > 900000) { tooBig.push(p.name || id); return; }
        ops.push(b => b.set(doc(col, id), data));
      });
      cloudMap.forEach((_, id) => { if (!keep.has(id)) ops.push(b => b.delete(doc(col, id))); });

      if (ops.length) {
        setStatus('☁️ 同步中…');
        for (let i = 0; i < ops.length; i += 400) {
          const batch = writeBatch(db);
          ops.slice(i, i + 400).forEach(f => f(batch));
          await batch.commit();
        }
      }
      if (tooBig.length) setStatus('⚠️ 「' + tooBig.join('、') + '」資料過大，未同步');
    } while (again);
  } catch (err) {
    console.error(err);
    setStatus('⚠️ 同步失敗');
  }
  syncing = false;
};

function startListen() {
  onSnapshot(col, snap => {
    const arr = [];
    snap.forEach(d => { const data = d.data(); if (data.id == null) data.id = d.id; arr.push(data); });
    arr.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
    cloudMap = new Map(arr.map(p => [String(p.id), stable(p)]));

    if (!ready) {
      if (!localStorage.getItem(FLAG)) {
        if (snap.metadata.fromCache) return; // 等伺服器的真實資料
        localStorage.setItem(FLAG, '1');
        // 第一次使用：雲端是空的、本機有資料 → 把本機資料上傳
        if (arr.length === 0 && window.getPlants().length) { ready = true; window.cloudSync(); return; }
      }
      ready = true;
    }
    window.applyCloudPlants(arr.map(({ order, ...p }) => p));
    setStatus(snap.metadata.hasPendingWrites ? '☁️ 同步中…' : '☁️ 已同步');
  }, err => { console.error(err); setStatus('⚠️ 同步失敗'); });
}

onAuthStateChanged(auth, user => { if (user && !started) { started = true; startListen(); } });
signInAnonymously(auth).catch(err => { console.error(err); setStatus('⚠️ 登入失敗'); });
window.addEventListener('offline', () => setStatus('📴 離線（上線後自動同步）'));
window.addEventListener('online', () => setStatus('☁️ 同步中…'));
</script>
